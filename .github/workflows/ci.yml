name: 🚀 Deploy on push main

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2

      - name: 📂 Install SSH
        run: apt-get update && apt-get install -y sshpass

      - name: 📂 Deploy to server via SSH
        run: |
          sshpass -p "${{ secrets.PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.PORT }} ${{ secrets.USERNAME }}@${{ secrets.HOST }} "cd /home/adminreg/runner_prod/be_chs_running && git fetch && git pull origin main"
